<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="800" height="500">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0a0a1a"/>
      <stop offset="100%" style="stop-color:#0f0f2a"/>
    </linearGradient>
    <linearGradient id="purple" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#7c3aed"/>
      <stop offset="100%" style="stop-color:#a855f7"/>
    </linearGradient>
    <linearGradient id="cyan" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#06b6d4"/>
      <stop offset="100%" style="stop-color:#22d3ee"/>
    </linearGradient>
    <linearGradient id="card1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1e1040"/>
      <stop offset="100%" style="stop-color:#16082a"/>
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
    <radialGradient id="orb1" cx="30%" cy="30%" r="60%">
      <stop offset="0%" style="stop-color:#7c3aed;stop-opacity:0.3"/>
      <stop offset="100%" style="stop-color:transparent;stop-opacity:0"/>
    </radialGradient>
    <radialGradient id="orb2" cx="70%" cy="70%" r="50%">
      <stop offset="0%" style="stop-color:#06b6d4;stop-opacity:0.2"/>
      <stop offset="100%" style="stop-color:transparent;stop-opacity:0"/>
    </radialGradient>
  </defs>

  <!-- Background -->
  <rect width="800" height="500" fill="url(#bg)"/>
  <rect width="800" height="500" fill="url(#orb1)"/>
  <rect width="800" height="500" fill="url(#orb2)"/>

  <!-- Grid lines -->
  <g opacity="0.06" stroke="#ffffff" stroke-width="0.5">
    <line x1="0" y1="50" x2="800" y2="50"/>
    <line x1="0" y1="100" x2="800" y2="100"/>
    <line x1="0" y1="150" x2="800" y2="150"/>
    <line x1="0" y1="200" x2="800" y2="200"/>
    <line x1="0" y1="250" x2="800" y2="250"/>
    <line x1="0" y1="300" x2="800" y2="300"/>
    <line x1="0" y1="350" x2="800" y2="350"/>
    <line x1="0" y1="400" x2="800" y2="400"/>
    <line x1="0" y1="450" x2="800" y2="450"/>
    <line x1="80" y1="0" x2="80" y2="500"/>
    <line x1="160" y1="0" x2="160" y2="500"/>
    <line x1="240" y1="0" x2="240" y2="500"/>
    <line x1="320" y1="0" x2="320" y2="500"/>
    <line x1="400" y1="0" x2="400" y2="500"/>
    <line x1="480" y1="0" x2="480" y2="500"/>
    <line x1="560" y1="0" x2="560" y2="500"/>
    <line x1="640" y1="0" x2="640" y2="500"/>
    <line x1="720" y1="0" x2="720" y2="500"/>
  </g>

  <!-- Top Nav Bar -->
  <rect x="0" y="0" width="800" height="52" fill="rgba(255,255,255,0.03)" rx="0"/>
  <rect x="0" y="51" width="800" height="1" fill="rgba(255,255,255,0.08)"/>
  <!-- Logo area -->
  <rect x="20" y="14" width="28" height="28" rx="8" fill="url(#purple)"/>
  <text x="26" y="33" font-family="monospace" font-size="14" font-weight="bold" fill="white">AI</text>
  <text x="56" y="32" font-family="Arial" font-size="13" font-weight="bold" fill="white">AIToolsHub</text>
  <!-- Nav links -->
  <text x="280" y="32" font-family="Arial" font-size="11" fill="rgba(255,255,255,0.5)">Explore</text>
  <text x="340" y="32" font-family="Arial" font-size="11" fill="rgba(255,255,255,0.5)">Pricing</text>
  <text x="400" y="32" font-family="Arial" font-size="11" fill="rgba(255,255,255,0.5)">API Docs</text>
  <!-- CTA -->
  <rect x="660" y="12" width="120" height="28" rx="14" fill="url(#purple)"/>
  <text x="693" y="30" font-family="Arial" font-size="11" font-weight="bold" fill="white">Get Started</text>

  <!-- Hero Section -->
  <text x="400" y="110" font-family="Arial" font-size="11" font-weight="bold" fill="rgba(167,139,250,0.9)" text-anchor="middle" letter-spacing="3">AI TOOLS RESELLER PLATFORM</text>
  <text x="400" y="148" font-family="Arial" font-size="28" font-weight="bold" fill="white" text-anchor="middle">Resell Premium AI Tools</text>
  <text x="400" y="178" font-family="Arial" font-size="28" font-weight="bold" text-anchor="middle">
    <tspan fill="url(#purple)">Effortlessly</tspan>
    <tspan fill="white"> &amp; </tspan>
    <tspan fill="url(#cyan)">Profitably</tspan>
  </text>
  <text x="400" y="210" font-family="Arial" font-size="12" fill="rgba(148,163,184,0.9)" text-anchor="middle">Access ChatGPT, Midjourney, Gemini and 50+ AI tools under one subscription</text>

  <!-- CTA Buttons -->
  <rect x="260" y="228" width="130" height="36" rx="18" fill="url(#purple)"/>
  <text x="325" y="251" font-family="Arial" font-size="12" font-weight="bold" fill="white" text-anchor="middle">Start Reselling →</text>
  <rect x="410" y="228" width="130" height="36" rx="18" fill="rgba(255,255,255,0.07)" stroke="rgba(255,255,255,0.15)" stroke-width="1"/>
  <text x="475" y="251" font-family="Arial" font-size="12" fill="rgba(255,255,255,0.8)" text-anchor="middle">View Demo</text>

  <!-- Tool Cards Row -->
  <!-- Card 1: ChatGPT -->
  <rect x="30" y="288" width="145" height="90" rx="12" fill="rgba(255,255,255,0.04)" stroke="rgba(255,255,255,0.08)" stroke-width="1"/>
  <rect x="44" y="302" width="32" height="32" rx="8" fill="rgba(16,163,127,0.2)"/>
  <text x="52" y="323" font-family="monospace" font-size="14" fill="#10a37f">G</text>
  <text x="82" y="318" font-family="Arial" font-size="11" font-weight="bold" fill="white">ChatGPT</text>
  <text x="82" y="332" font-family="Arial" font-size="9" fill="rgba(148,163,184,0.7)">GPT-4o Access</text>
  <rect x="44" y="344" width="50" height="16" rx="8" fill="rgba(16,163,127,0.2)"/>
  <text x="52" y="356" font-family="Arial" font-size="8" fill="#10a37f">ACTIVE</text>
  <text x="140" y="356" font-family="Arial" font-size="9" fill="rgba(148,163,184,0.6)">$9/mo</text>

  <!-- Card 2: Midjourney -->
  <rect x="185" y="288" width="145" height="90" rx="12" fill="rgba(255,255,255,0.04)" stroke="rgba(124,58,237,0.3)" stroke-width="1"/>
  <rect x="199" y="302" width="32" height="32" rx="8" fill="rgba(124,58,237,0.25)"/>
  <text x="206" y="323" font-family="monospace" font-size="14" fill="#a78bfa">M</text>
  <text x="237" y="318" font-family="Arial" font-size="11" font-weight="bold" fill="white">Midjourney</text>
  <text x="237" y="332" font-family="Arial" font-size="9" fill="rgba(148,163,184,0.7)">Image Gen v6</text>
  <rect x="199" y="344" width="60" height="16" rx="8" fill="rgba(124,58,237,0.2)"/>
  <text x="207" y="356" font-family="Arial" font-size="8" fill="#a78bfa">POPULAR</text>
  <text x="295" y="356" font-family="Arial" font-size="9" fill="rgba(148,163,184,0.6)">$12/mo</text>

  <!-- Card 3: Gemini -->
  <rect x="340" y="288" width="145" height="90" rx="12" fill="rgba(255,255,255,0.04)" stroke="rgba(6,182,212,0.25)" stroke-width="1"/>
  <rect x="354" y="302" width="32" height="32" rx="8" fill="rgba(6,182,212,0.2)"/>
  <text x="361" y="323" font-family="monospace" font-size="14" fill="#22d3ee">G</text>
  <text x="392" y="318" font-family="Arial" font-size="11" font-weight="bold" fill="white">Gemini Pro</text>
  <text x="392" y="332" font-family="Arial" font-size="9" fill="rgba(148,163,184,0.7)">Google AI</text>
  <rect x="354" y="344" width="42" height="16" rx="8" fill="rgba(6,182,212,0.15)"/>
  <text x="362" y="356" font-family="Arial" font-size="8" fill="#22d3ee">NEW</text>
  <text x="450" y="356" font-family="Arial" font-size="9" fill="rgba(148,163,184,0.6)">$8/mo</text>

  <!-- Card 4: DALL-E -->
  <rect x="495" y="288" width="145" height="90" rx="12" fill="rgba(255,255,255,0.04)" stroke="rgba(236,72,153,0.25)" stroke-width="1"/>
  <rect x="509" y="302" width="32" height="32" rx="8" fill="rgba(236,72,153,0.2)"/>
  <text x="516" y="323" font-family="monospace" font-size="14" fill="#f472b6">D</text>
  <text x="547" y="318" font-family="Arial" font-size="11" font-weight="bold" fill="white">DALL-E 3</text>
  <text x="547" y="332" font-family="Arial" font-size="9" fill="rgba(148,163,184,0.7)">Art Generation</text>
  <rect x="509" y="344" width="55" height="16" rx="8" fill="rgba(236,72,153,0.15)"/>
  <text x="517" y="356" font-family="Arial" font-size="8" fill="#f472b6">FEATURED</text>
  <text x="605" y="356" font-family="Arial" font-size="9" fill="rgba(148,163,184,0.6)">$10/mo</text>

  <!-- Stats Bar -->
  <rect x="30" y="398" width="740" height="68" rx="12" fill="rgba(255,255,255,0.03)" stroke="rgba(255,255,255,0.06)" stroke-width="1"/>
  <!-- Stat 1 -->
  <text x="120" y="426" font-family="Arial" font-size="18" font-weight="bold" fill="url(#purple)" text-anchor="middle">50+</text>
  <text x="120" y="444" font-family="Arial" font-size="9" fill="rgba(148,163,184,0.7)" text-anchor="middle">AI TOOLS</text>
  <!-- Divider -->
  <line x1="240" y1="412" x2="240" y2="454" stroke="rgba(255,255,255,0.08)" stroke-width="1"/>
  <!-- Stat 2 -->
  <text x="340" y="426" font-family="Arial" font-size="18" font-weight="bold" fill="url(#cyan)" text-anchor="middle">2K+</text>
  <text x="340" y="444" font-family="Arial" font-size="9" fill="rgba(148,163,184,0.7)" text-anchor="middle">ACTIVE USERS</text>
  <!-- Divider -->
  <line x1="460" y1="412" x2="460" y2="454" stroke="rgba(255,255,255,0.08)" stroke-width="1"/>
  <!-- Stat 3 -->
  <text x="570" y="426" font-family="Arial" font-size="18" font-weight="bold" fill="#f472b6" text-anchor="middle">99.9%</text>
  <text x="570" y="444" font-family="Arial" font-size="9" fill="rgba(148,163,184,0.7)" text-anchor="middle">UPTIME</text>
  <!-- Divider -->
  <line x1="680" y1="412" x2="680" y2="454" stroke="rgba(255,255,255,0.08)" stroke-width="1"/>
  <!-- Stat 4 -->
  <text x="730" y="426" font-family="Arial" font-size="18" font-weight="bold" fill="#34d399" text-anchor="middle">24/7</text>
  <text x="730" y="444" font-family="Arial" font-size="9" fill="rgba(148,163,184,0.7)" text-anchor="middle">SUPPORT</text>

  <!-- Glow accents -->
  <circle cx="120" cy="180" r="80" fill="rgba(124,58,237,0.08)" filter="url(#glow)"/>
  <circle cx="680" cy="300" r="60" fill="rgba(6,182,212,0.07)" filter="url(#glow)"/>
</svg>